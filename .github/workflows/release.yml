name: Publish Release

on:
  push:
    branches:
      - master
    tags:
      - release/*
  pull_request:
    branches:
      master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ matrix.container }}
      env:
        DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        target:
          - arm-linux-gnueabihf
          - aarch64-linux-gnu
          - x86_64-linux-gnu
          - riscv64-linux-gnu
        buildtype:
          - debug
          - release
        include:
          - target: 'x86_64-linux-gnu'
            is-cross: false
            debian-arch: 'amd64'
            container: 'debian:bookworm'

          - target: 'aarch64-linux-gnu'
            is-cross: true
            debian-arch: 'arm64'
            container: 'debian:bookworm'

          - target: 'arm-linux-gnueabihf'
            is-cross: true
            debian-arch: 'armhf'
            container: 'debian:bookworm'

          - target: 'riscv64-linux-gnu'
            is-cross: true
            debian-arch: 'riscv64'
            container: 'debian:trixie'

    steps:
      - name: Add debian multiarch
        if: matrix.is-cross
        run: dpkg --add-architecture ${{ matrix.debian-arch }}

      # git needs to be installed before checking out, otherwise the checkout will fallback to the REST API,
      # and the submodule download won't work.
      - name: Install dependencies
        env:
          ARCH: ${{ matrix.debian-arch }}
        run: |
          apt-get update && apt-get install -y \
            git cmake ninja-build clang lld xz-utils \
            libdrm-dev:$ARCH libgbm-dev:$ARCH libsystemd-dev:$ARCH libinput-dev:$ARCH libudev-dev:$ARCH libxkbcommon-dev:$ARCH \
            libgstreamer-plugins-base1.0-dev:$ARCH \
            libvulkan-dev:$ARCH \
            libgl1-mesa-dev:$ARCH libgles2-mesa-dev:$ARCH libegl1-mesa-dev:$ARCH \
            ${{ matrix.is-cross && format('gcc-{0} g++-{0}', matrix.target) || '' }}

      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Configure CMake
        env:
          CMAKE_SYSTEM_NAME: ${{ matrix.is-cross && '-DCMAKE_SYSTEM_NAME=Linux' || '' }}
          CMAKE_C_COMPILER_TARGET: ${{ matrix.is-cross && format('-DCMAKE_C_COMPILER_TARGET={0}', matrix.target) || '' }}
          CMAKE_CXX_COMPILER_TARGET: ${{ matrix.is-cross && format('-DCMAKE_CXX_COMPILER_TARGET={0}', matrix.target) || '' }}
          PKG_CONFIG_PATH: ${{ format('/usr/lib/{0}/pkgconfig:/usr/share/pkgconfig', matrix.target) }}
          PKG_CONFIG_LIBDIR: ${{ format('/usr/lib/{0}', matrix.target) }}
          PKG_CONFIG_SYSROOT_DIR: ''
        run: |
          cmake \
            -B ./build \
            -S . \
            -DCMAKE_BUILD_TYPE=${{ matrix.buildtype }} \
            $CMAKE_SYSTEM_NAME \
            $CMAKE_C_COMPILER_TARGET \
            $CMAKE_CXX_COMPILER_TARGET \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_GSTREAMER_AUDIO_PLAYER_PLUGIN=On \
            -DBUILD_GSTREAMER_VIDEO_PLAYER_PLUGIN=On \
            -DENABLE_VULKAN=ON \
            -DENABLE_OPENGL=ON \
            -DENABLE_TESTS=On \
            -DBUILD_SENTRY_PLUGIN=OFF \
            -DCMAKE_INSTALL_PREFIX=$PWD/dist \
            -GNinja

      - name: Build & Install
        run: cmake --build ./build --target install --config ${{ matrix.buildtype }}

      - name: Package
        run: |
          mkdir -p artifact && cd artifact
          cp -r ../dist/bin/flutter-pi .

          tar -cJf ../flutterpi-${{ matrix.target }}-${{ matrix.buildtype }}.tar.xz .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: flutterpi-${{ matrix.target }}-${{ matrix.buildtype }}-tar-xz
          path: flutterpi-${{ matrix.target }}-${{ matrix.buildtype }}.tar.xz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release/')
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: flutterpi-*-tar-xz
          merge-multiple: true
          path: release-files

      - name: Prepare release
        working-directory: release-files
        run: |
          for target in arm-linux-gnueabihf aarch64-linux-gnu x86_64-linux-gnu riscv64-linux-gnu; do
            for buildtype in debug release; do
              file="flutterpi-$target-$buildtype.tar.xz"
              test -s "$file"
              tar -tJf "$file" | grep -Fx './flutter-pi'
            done
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 8
          sha256sum ./*.tar.xz > SHA256SUMS

      - name: Create draft and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            release-files/*.tar.xz release-files/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_sha=$(gh api --method GET "repos/$GH_REPO/commits" \
            -f sha="$RELEASE_TAG" -f per_page=1 --jq '.[0].sha')
          test "$tag_sha" = "$RELEASE_SHA"
          gh release edit "$RELEASE_TAG" --draft=false --verify-tag
