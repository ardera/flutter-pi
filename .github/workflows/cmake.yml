name: CMake

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pi4:
    name: Build & Test on Raspberry Pi 4
    if: vars.ENABLE_PI4_RUNNERS == 'true'
    runs-on: ARM64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Configure CMake
        run: |
          cmake \
            -B ./build \
            -S . \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_OPENGL=ON \
            -DENABLE_VULKAN=ON \
            -DBUILD_GSTREAMER_AUDIO_PLAYER_PLUGIN=ON \
            -DBUILD_GSTREAMER_VIDEO_PLAYER_PLUGIN=ON \
            -DENABLE_TESTS=ON

      - name: Build
        run: cmake --build ./build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  container:
    name: Build & Test in Container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ matrix.container }}
      env:
        DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        container:
          - "debian:trixie"
          - "debian:bookworm"
        graphics-backends:
          - vulkan-only
          - opengl-only
          - vulkan-and-opengl
        compiler:
          - gcc
          - clang
        build-type:
          - Debug
          - Release
        sentry-plugin:
          - "off"
          - "on-inproc"
          - "on-crashpad-bundled"
          - "on-crashpad-unbundled"
        include:
          - graphics-backends: "vulkan-only"
            enable-vulkan: "on"
            enable-opengl: "off"

          - graphics-backends: "opengl-only"
            enable-vulkan: "off"
            enable-opengl: "on"

          - graphics-backends: "vulkan-and-opengl"
            enable-vulkan: "on"
            enable-opengl: "on"

          - enable-opengl: "on"
            opengl-deps: "libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev"

          - enable-vulkan: "on"
            vulkan-deps: "libvulkan-dev"

          - compiler: "gcc"
            cxx-compiler: "g++"
            gcc-deps: "gcc g++"

          - compiler: "clang"
            cxx-compiler: "clang++"
            clang-deps: "clang"

          - sentry-plugin: "off"
            sentry-plugin-enable: "off"
            sentry-deps: ""

          - sentry-plugin: "on-inproc"
            sentry-plugin-enable: "on"
            sentry-backend: "inproc"
            sentry-deps: "libcurl4-openssl-dev"

          - sentry-plugin: "on-crashpad-bundled"
            sentry-plugin-enable: "on"
            sentry-backend: "crashpad"
            sentry-bundled-crashpad-handler: "on"
            sentry-deps: "libcurl4-openssl-dev"

          - sentry-plugin: "on-crashpad-unbundled"
            sentry-plugin-enable: "on"
            sentry-backend: "crashpad"
            sentry-bundled-crashpad-handler: "off"
            sentry-deps: "libcurl4-openssl-dev"
    steps:
      # git needs to be installed before checking out, otherwise the checkout will fallback to the REST API,
      # and the submodule download won't work.
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            git cmake libdrm-dev libgbm-dev \
            fonts-liberation fontconfig libsystemd-dev libinput-dev libudev-dev \
            libxkbcommon-dev ninja-build libgstreamer-plugins-base1.0-dev \
            ${{ matrix.vulkan-deps }} \
            ${{ matrix.opengl-deps }} \
            ${{ matrix.gcc-deps }} \
            ${{ matrix.clang-deps }} \
            ${{ matrix.sentry-deps }}

      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Configure CMake
        run: |
          cmake \
            -B ./build \
            -S . \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx-compiler }} \
            -DBUILD_GSTREAMER_AUDIO_PLAYER_PLUGIN=On \
            -DBUILD_GSTREAMER_VIDEO_PLAYER_PLUGIN=On \
            -DENABLE_VULKAN=${{ matrix.enable-vulkan }} \
            -DENABLE_OPENGL=${{ matrix.enable-opengl }} \
            -DENABLE_TESTS=On \
            -DBUILD_SENTRY_PLUGIN=${{ matrix.sentry-plugin-enable }} \
            -DSENTRY_BACKEND=${{ matrix.sentry-backend }} \
            -DSENTRY_PLUGIN_BUNDLE_CRASHPAD_HANDLER=${{ matrix.sentry-bundled-crashpad-handler }} \
            -GNinja

      - name: Build
        run: cmake --build ./build --config ${{ matrix.build-type }}

      - name: Test
        working-directory: build
        run: ctest -C ${{ matrix.build-type }} --output-on-failure

  required:
    name: required checks
    if: always()
    needs: [pi4, container]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "some required jobs did not succeed."; exit 1 ;;
            esac
          done
          echo 'all required checks passed.'
