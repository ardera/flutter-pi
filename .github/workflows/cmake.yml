name: CMake

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pi4:
    name: Build & Test on Raspberry Pi 4
    if: vars.ENABLE_PI4_RUNNERS == 'true'
    runs-on: ARM64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Configure CMake
        run: |
          cmake \
            -B ./build \
            -S . \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_OPENGL=ON \
            -DENABLE_VULKAN=ON \
            -DBUILD_GSTREAMER_AUDIO_PLAYER_PLUGIN=ON \
            -DBUILD_GSTREAMER_VIDEO_PLAYER_PLUGIN=ON \
            -DENABLE_TESTS=ON

      - name: Build
        run: cmake --build ./build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  container:
    name: Build & Test (${{ matrix.os }}, ${{ matrix.compiler.cc }}, ${{ matrix.build-type }}, ${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: debian:${{ matrix.os }}
      env:
        DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        os: [bookworm, trixie]
        compiler:
          - { cc: gcc, cxx: g++, packages: "gcc g++" }
          - { cc: clang, cxx: clang++, packages: clang }
        build-type: [Debug, Release]
        preset: [ci-common]
        include:
          - packages: >-
              libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev
              libgstreamer-plugins-base1.0-dev libseat-dev

          - os: trixie
            compiler: { cc: gcc, cxx: g++, packages: "gcc g++" }
            build-type: Debug
            preset: ci-opengl-only
            packages: >-
              libegl1-mesa-dev libgles2-mesa-dev
              libgstreamer-plugins-base1.0-dev libseat-dev

          - os: trixie
            compiler: { cc: gcc, cxx: g++, packages: "gcc g++" }
            build-type: Debug
            preset: ci-vulkan-only
            packages: >-
              libvulkan-dev libgstreamer-plugins-base1.0-dev libseat-dev

          - os: trixie
            compiler: { cc: gcc, cxx: g++, packages: "gcc g++" }
            build-type: Debug
            preset: ci-minimal
            packages: libegl1-mesa-dev libgles2-mesa-dev

          - os: trixie
            compiler: { cc: gcc, cxx: g++, packages: "gcc g++" }
            build-type: Debug
            preset: ci-charset-converter
            packages: >-
              libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev
              libgstreamer-plugins-base1.0-dev libseat-dev

          - os: trixie
            compiler: { cc: gcc, cxx: g++, packages: "gcc g++" }
            build-type: Debug
            preset: ci-sentry-inproc
            packages: >-
              libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev
              libgstreamer-plugins-base1.0-dev libseat-dev libcurl4-openssl-dev

          - os: trixie
            compiler: { cc: gcc, cxx: g++, packages: "gcc g++" }
            build-type: Debug
            preset: ci-sentry-crashpad-bundled
            packages: >-
              libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev
              libgstreamer-plugins-base1.0-dev libseat-dev libcurl4-openssl-dev

          - os: trixie
            compiler: { cc: gcc, cxx: g++, packages: "gcc g++" }
            build-type: Debug
            preset: ci-sentry-crashpad-unbundled
            packages: >-
              libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev
              libgstreamer-plugins-base1.0-dev libseat-dev libcurl4-openssl-dev

          - os: trixie
            compiler: { cc: gcc, cxx: g++, packages: "gcc g++" }
            build-type: Debug
            preset: ci-asan-ubsan
            packages: >-
              libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev
              libgstreamer-plugins-base1.0-dev libseat-dev
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      COMPILER_PACKAGES: ${{ matrix.compiler.packages }}
      PACKAGES: ${{ matrix.packages }}
    steps:
      # git needs to be installed before checking out, otherwise the checkout will fallback to the REST API,
      # and the submodule download won't work.
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build pkg-config \
            libdrm-dev libgbm-dev libsystemd-dev libinput-dev libudev-dev libxkbcommon-dev \
            $COMPILER_PACKAGES $PACKAGES

      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Configure CMake
        run: |
          cmake \
            --preset ${{ matrix.preset }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}

      - name: Build
        run: cmake --build ./build/${{ matrix.preset }}

      - name: Test
        working-directory: build/${{ matrix.preset }}
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --output-on-failure

  required:
    name: required checks
    if: always()
    needs: [pi4, container]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "some required jobs did not succeed."; exit 1 ;;
            esac
          done
          echo 'all required checks passed.'
